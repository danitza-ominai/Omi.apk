name: Compilar APK Nativo de OMI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Configurar Java 17 para Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 4. Generar Proyecto Nativo Android con Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Omi Cyber-Neko" "com.omi.cyberneko" --web-dir www
          npx cap add android

      - name: 5. Inyectar Permisos Nativos (Uso de Apps, Micrófono y Audio)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <application/g' $MANIFEST

      - name: 6. Sincronizar y Compilar el archivo .APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 7. Entregar APK listo para descargar en el celular
        uses: actions/upload-artifact@v4
        with:
          name: OMI-CyberNeko-Installer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
